<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0e1620">
<title>平民宇宙 · 人生模拟（3D 开源版）</title>
<style>
:root{
  --glass:rgba(14,34,48,.46); --glass-2:rgba(18,40,56,.6);
  --border:rgba(120,225,255,.55); --text:#eaf7ff; --accent:#8fd6ff;
  --shadow:0 0 26px rgba(80,200,240,.32), 0 10px 30px rgba(0,0,0,.3);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;overflow:hidden;}
body{background:#0e1620;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--text);user-select:none;-webkit-user-select:none;}
canvas#scene{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block;}
#app{position:fixed;inset:0;z-index:5;pointer-events:none;}
#app > *{pointer-events:auto;}

/* 通用屏幕（开始/身份） */
.screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;
  padding:max(18px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom));
  background:rgba(8,14,20,.5);backdrop-filter:blur(3px);overflow-y:auto;animation:fade .35s ease;}
@keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.center{margin:auto;width:100%;max-width:560px;text-align:center;
  background:linear-gradient(160deg,rgba(18,40,56,.92),rgba(12,28,40,.88));
  border:1.5px solid var(--border);border-radius:22px;padding:26px 22px;box-shadow:var(--shadow);}
.brand{font-size:13px;letter-spacing:6px;color:#ff8a5c;font-weight:700;}
.title{font-size:clamp(30px,9vw,52px);font-weight:900;margin:6px 0 2px;letter-spacing:2px;}
.subtitle{color:#9fb6c4;font-size:14px;margin-bottom:20px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 22px;
  border-radius:14px;font-size:16px;font-weight:700;background:#10222e;color:var(--text);
  border:1.5px solid var(--border);box-shadow:var(--shadow);transition:.15s;}
.btn:active{transform:scale(.96);}
.btn.primary{background:linear-gradient(135deg,#1c6fb0,#0f5a8a);}
.btn.ghost{background:transparent;}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
.hint{color:#9fb6c4;font-size:13px;line-height:1.7;}

/* 身份选择 */
.id-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:14px 0;}
.id-card{background:rgba(255,255,255,.06);border:2px solid transparent;border-radius:14px;padding:14px;
  text-align:left;transition:.15s;cursor:pointer;}
.id-card.sel{border-color:#ff8a5c;background:rgba(255,138,92,.12);}
.id-ico{font-size:30px;}
.id-name{font-weight:800;font-size:17px;margin:4px 0 2px;}
.id-desc{font-size:12px;color:#9fb6c4;line-height:1.5;}

/* 顶部 HUD */
#hud{position:fixed;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;z-index:6;
  display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;}
.hud-left{display:flex;gap:8px;flex-wrap:wrap;}
.chip{background:var(--glass);border:1px solid rgba(120,225,255,.3);border-radius:12px;padding:6px 10px;
  font-size:12px;font-weight:700;box-shadow:var(--shadow);display:flex;align-items:center;gap:6px;white-space:nowrap;
  backdrop-filter:blur(8px);}
.chip .v{font-variant-numeric:tabular-nums;}
.bar{width:42px;height:6px;border-radius:4px;background:rgba(255,255,255,.15);overflow:hidden;}
.bar > i{display:block;height:100%;background:#39d0ff;}
.hud-right{display:flex;gap:8px;}
.icon-btn{width:40px;height:40px;border-radius:50%;background:var(--glass);border:1px solid rgba(120,225,255,.3);
  font-size:17px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;}
.icon-btn.on{border-color:#ffd166;color:#ffd166;}

/* 人生控制台（透明全息，悬浮在角色前方下方） */
#panel{position:fixed;z-index:6;left:14px;right:14px;bottom:138px;top:auto;
  background:var(--glass);border:1px solid var(--border);box-shadow:var(--shadow);
  backdrop-filter:blur(12px) saturate(1.3);border-radius:18px;display:flex;flex-direction:column;
  padding:10px 12px;max-height:34vh;transition:transform .2s;}
#panel::after{content:'';position:absolute;inset:0;pointer-events:none;border-radius:18px;
  background:repeating-linear-gradient(to bottom,rgba(120,225,255,.05) 0 2px,transparent 2px 5px);opacity:.5;}
.phead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;padding-bottom:8px;
  border-bottom:1px solid rgba(120,225,255,.28);cursor:grab;touch-action:none;}
.phead:active{cursor:grabbing;}
.phead #pTitle{font-size:14px;font-weight:800;color:var(--text);display:flex;align-items:center;gap:6px;}
.phead #pTitle small{font-weight:500;color:var(--accent);}
#panelToggle{width:28px;height:28px;border-radius:8px;background:rgba(40,72,92,.6);font-size:14px;font-weight:800;color:var(--text);}
#panel.collapsed{max-height:48px;overflow:hidden;}
#panel.collapsed #stageLabel,#panel.collapsed #actions,#panel.collapsed #ad{display:none;}
#stageLabel{font-size:12px;font-weight:800;color:var(--accent);text-align:center;margin-bottom:8px;}
#actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;overflow-y:auto;padding-right:2px;}
.act{background:rgba(255,255,255,.07);border:1.5px solid transparent;border-radius:12px;padding:9px 6px;text-align:center;
  font-size:12px;font-weight:700;color:var(--text);transition:.12s;}
.act:active{transform:translateY(2px);background:rgba(120,225,255,.18);border-color:var(--border);}
.act .e{font-size:18px;display:block;margin-bottom:2px;}
.act .d{font-size:10px;color:#9fb6c4;font-weight:500;margin-top:2px;line-height:1.3;}
#ad{margin:8px 0 2px;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.06);
  border:1px dashed rgba(120,225,255,.4);border-radius:12px;padding:7px 11px;cursor:pointer;}
#ad .tag{font-size:10px;font-weight:800;color:#0e1620;background:#ffd166;border-radius:6px;padding:2px 6px;flex:none;}
#ad .t{font-size:12px;font-weight:700;line-height:1.25;}
#ad .s{font-size:10px;color:#9fb6c4;}

/* 互动提示 / 按钮 */
#interactHint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(34vh + 150px);z-index:7;
  background:var(--glass-2);border:1px solid var(--border);border-radius:12px;padding:8px 14px;
  font-size:13px;font-weight:700;display:none;align-items:center;gap:8px;backdrop-filter:blur(8px);}
#interactHint .go{background:#1c6fb0;border:none;border-radius:9px;padding:6px 12px;color:#fff;font-weight:800;font-size:13px;}

/* 虚拟摇杆 */
#joystick{position:fixed;left:24px;bottom:24px;width:120px;height:120px;border-radius:50%;
  background:rgba(20,40,56,.4);border:1px solid rgba(120,225,255,.35);z-index:7;display:none;touch-action:none;}
#joystick .nub{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;
  background:rgba(120,225,255,.5);border:1px solid #fff;}
@media (hover:none){ #joystick{display:block;} }

/* 事件弹窗（全息悬浮卡） */
.modal{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
  background:rgba(8,14,20,.5);padding:18px;backdrop-filter:blur(2px);}
.modal.hidden{display:none;}
.box{background:var(--glass-2);border:1.5px solid var(--border);border-radius:18px;max-width:440px;width:100%;
  padding:20px;box-shadow:var(--shadow);animation:pop .25s ease;}
@keyframes pop{from{transform:scale(.9) translateY(20px);opacity:0;}to{transform:none;opacity:1;}}
.box h2{margin:0 0 8px;font-size:20px;color:var(--text);}
.box p{font-size:14px;line-height:1.7;color:#cfe6f2;margin:0 0 14px;}
.choices{display:flex;flex-direction:column;gap:10px;}
.choice{background:rgba(255,255,255,.07);border:1.5px solid var(--border);border-radius:13px;padding:11px 14px;
  text-align:left;font-weight:700;font-size:14px;color:var(--text);transition:.12s;}
.choice:active{transform:scale(.97);background:rgba(120,225,255,.18);}
.choice small{display:block;font-weight:500;color:#9fb6c4;font-size:12px;margin-top:3px;}

/* 场景切换菜单 */
#sceneMenu{position:fixed;inset:0;z-index:15;display:none;align-items:center;justify-content:center;
  background:rgba(8,14,20,.5);backdrop-filter:blur(3px);}
#sceneMenu .box{max-width:420px;}
.scene-list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.scene-item{background:rgba(255,255,255,.06);border:1.5px solid var(--border);border-radius:12px;padding:12px;
  font-weight:700;font-size:14px;text-align:center;cursor:pointer;}
.scene-item:active{background:rgba(120,225,255,.18);}
.scene-item.cur{border-color:#ffd166;color:#ffd166;}

/* 浮动动画 */
@keyframes floaty{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}
#panel.float-on{animation:floaty 6s ease-in-out infinite;}
#panel.dragging{animation:none !important;}
</style>
</head>
<body>
<div id="app"></div>
<script src="three.min.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
